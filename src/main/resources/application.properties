spring.application.name=integration-engine
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/integration_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:120}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:24}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:0}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.overwrite-existing-jobs=true
spring.quartz.properties.org.quartz.scheduler.instanceName=integration-cluster
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.threadPool.threadCount=${INTEGRATION_QUARTZ_THREAD_COUNT:24}
spring.quartz.properties.org.quartz.threadPool.threadPriority=5
spring.quartz.properties.org.quartz.jobStore.class=org.springframework.scheduling.quartz.LocalDataSourceJobStore
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.jobStore.useProperties=false
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=${INTEGRATION_QUARTZ_CLUSTER_CHECKIN_MS:20000}
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=${INTEGRATION_QUARTZ_MISFIRE_THRESHOLD_MS:60000}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.lifecycle.timeout-per-shutdown-phase=${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:30s}
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:512}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:32}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:1000}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT_MS:5000}
server.tomcat.keep-alive-timeout=${SERVER_TOMCAT_KEEPALIVE_TIMEOUT_MS:20000}
server.tomcat.max-keep-alive-requests=${SERVER_TOMCAT_MAX_KEEPALIVE_REQUESTS:1000}
server.shutdown=${SERVER_SHUTDOWN:graceful}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/plain,text/xml,text/html,text/css,application/javascript


management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES_ENABLED:true}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}


logging.file.name=${INTEGRATION_LOG_FILE:logs/integration-engine.log}

logging.level.root=${ROOT_LOG_LEVEL:INFO}
logging.level.com.example.integration=${APP_LOG_LEVEL:INFO}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [corr:%X{correlationId:-na} client:%X{clientName:-na} schedule:%X{scheduleType:-na}] - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [corr:%X{correlationId:-na} client:%X{clientName:-na} schedule:%X{scheduleType:-na}] - %msg%n

logging.logback.rollingpolicy.file-name-pattern=${INTEGRATION_LOG_FILE_PATTERN:logs/archive/integration-engine.%d{yyyy-MM-dd}.%i.log.gz}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=15
logging.logback.rollingpolicy.clean-history-on-start=true
logging.logback.rollingpolicy.total-size-cap=1GB


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cors.allowed-methods=${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${APP_CORS_ALLOWED_HEADERS:*}
app.cors.exposed-headers=${APP_CORS_EXPOSED_HEADERS:Location}
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age-seconds=${APP_CORS_MAX_AGE_SECONDS:3600}

integration.executor.pool-size=${INTEGRATION_EXECUTOR_POOL_SIZE:64}
integration.executor.queue-capacity=${INTEGRATION_EXECUTOR_QUEUE_CAPACITY:1024}
integration.scheduler.pool-size=${INTEGRATION_SCHEDULER_POOL_SIZE:16}
integration.http-client.max-connections=${INTEGRATION_HTTP_CLIENT_MAX_CONNECTIONS:1000}
integration.http-client.pending-acquire-max-count=${INTEGRATION_HTTP_CLIENT_PENDING_ACQUIRE_MAX_COUNT:4000}
integration.http-client.connect-timeout-ms=${INTEGRATION_HTTP_CLIENT_CONNECT_TIMEOUT_MS:5000}
integration.http-client.response-timeout-seconds=${INTEGRATION_HTTP_CLIENT_RESPONSE_TIMEOUT_SECONDS:90}

integration.retry.poll-interval-ms=${INTEGRATION_RETRY_POLL_INTERVAL_MS:60000}
integration.retry.delay-minutes=${INTEGRATION_RETRY_DELAY_MINUTES:15}
integration.scalable.roles=${INTEGRATION_RUNTIME_ROLES:API,SCHEDULER,WORKER}
integration.scalable.migration-mode=${INTEGRATION_SCALABLE_MIGRATION_MODE:QUEUE}
integration.scalable.job-store-vendor=${INTEGRATION_SCALABLE_JOB_STORE_VENDOR:MYSQL}
integration.scalable.worker.batch-size=${INTEGRATION_SCALABLE_WORKER_BATCH_SIZE:64}
integration.scalable.worker.max-concurrency=${INTEGRATION_SCALABLE_WORKER_MAX_CONCURRENCY:128}
integration.scalable.worker.queue-capacity=${INTEGRATION_SCALABLE_WORKER_QUEUE_CAPACITY:2048}
integration.scalable.worker.poll-interval-ms=${INTEGRATION_SCALABLE_WORKER_POLL_INTERVAL_MS:1000}
integration.scalable.worker.lease-seconds=${INTEGRATION_SCALABLE_WORKER_LEASE_SECONDS:300}
integration.scalable.worker.heartbeat-seconds=${INTEGRATION_SCALABLE_WORKER_HEARTBEAT_SECONDS:15}

integration.csv.temp-directory=${INTEGRATION_CSV_TEMP_DIR:${java.io.tmpdir}/integration-engine}
integration.storage.http-api.upload-url-template.monthly=${INTEGRATION_HTTP_API_UPLOAD_URL_TEMPLATE_MONTHLY:}
integration.storage.http-api.upload-url-template.hourly=${INTEGRATION_HTTP_API_UPLOAD_URL_TEMPLATE_HOURLY:}
integration.storage.http-api.upload-url-template.daily=${INTEGRATION_HTTP_API_UPLOAD_URL_TEMPLATE_DAILY:}
integration.storage.http-api.access-token-header-name=${INTEGRATION_HTTP_API_ACCESS_TOKEN_HEADER_NAME:accessToken}
integration.storage.http-api.user-id-header-name=${INTEGRATION_HTTP_API_USER_ID_HEADER_NAME:userId}
integration.storage.http-api.tenants-json=${INTEGRATION_HTTP_API_TENANTS_JSON:}
